name: Sync GitVerse

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitverse-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync main and version tags
        env:
          DEPLOY_KEY: ${{ secrets.GITVERSE_DEPLOY_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" || { echo 'Missing GITVERSE_DEPLOY_KEY' >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gitverse_key
          chmod 600 ~/.ssh/gitverse_key
          echo 'gitverse.ru ssh-rsa ' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/gitverse_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git fetch origin main --tags
          git push git@gitverse.ru:yasg1988/tishte-fonts.git refs/remotes/origin/main:refs/heads/main
          git push git@gitverse.ru:yasg1988/tishte-fonts.git 'refs/tags/v*:refs/tags/v*'
