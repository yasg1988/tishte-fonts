name: Publishing assets

on:
  pull_request:
    paths:
      - ".github/workflows/publishing.yml"
      - "site/**"
      - "npm/**"
      - "scripts/build_publishing_assets.py"
      - "scripts/audit_publishing_assets.py"
      - "docs/images/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publishing.yml"
      - "site/**"
      - "npm/**"
      - "scripts/build_publishing_assets.py"
      - "scripts/audit_publishing_assets.py"
      - "docs/images/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Download and verify release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download v1.000 --repo "$GITHUB_REPOSITORY" \
            --pattern "Tishte-Serif-v1.000.zip" \
            --pattern "Tishte-Serif-v1.000.zip.sha256" \
            --pattern "Tishte-Sans-v1.000.zip" \
            --pattern "Tishte-Sans-v1.000.zip.sha256" \
            --dir dist
          cd dist
          sha256sum --check Tishte-Serif-v1.000.zip.sha256
          sha256sum --check Tishte-Sans-v1.000.zip.sha256
      - name: Build and audit publishing assets
        run: |
          python scripts/build_publishing_assets.py
          python scripts/audit_publishing_assets.py
      - name: Validate npm package contents
        working-directory: build/publishing/npm
        run: npm pack --dry-run
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/publishing/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
