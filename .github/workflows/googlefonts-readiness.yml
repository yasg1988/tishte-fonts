name: Google Fonts readiness

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "googlefonts/**"
      - "scripts/**"
      - "sources/tishte-serif/**"
      - "requirements*.txt"
      - ".github/workflows/googlefonts-readiness.yml"
  pull_request:
    paths:
      - "data/**"
      - "googlefonts/**"
      - "scripts/**"
      - "sources/tishte-serif/**"
      - "requirements*.txt"
      - ".github/workflows/googlefonts-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fontbakery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FontForge and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -r requirements-googlefonts.txt
      - name: Install pinned Fontspector
        env:
          FONTSPECTOR_VERSION: "1.7.3"
          FONTSPECTOR_SHA256: "43bf91f677baf355b20adfe4c0914365c5b510f0ab4c6691bb26cbc8c7e18b1b"
        run: |
          archive="$RUNNER_TEMP/fontspector.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/fonttools/fontspector/releases/download/fontspector-v${FONTSPECTOR_VERSION}/fontspector-v${FONTSPECTOR_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${FONTSPECTOR_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/fontspector-dev-x86_64-unknown-linux-gnu/fontspector" "$RUNNER_TEMP/fontspector"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Fetch pinned upstream inputs
        run: python scripts/fetch_sans_upstream.py
      - name: Build Google Fonts packages
        run: python scripts/build_googlefonts.py --version 1.000
      - name: Validate editable UFO exports
        run: find build/googlefonts/upstream -type d -name '*.ufo' -exec ufolint '{}' \;
      - name: Verify reproducible staging tree
        run: python scripts/audit_googlefonts_reproducible.py --version 1.000
      - name: Run Google Fonts profile
        run: python scripts/audit_googlefonts.py
      - name: Run current Fontspector Google Fonts profile
        run: python scripts/audit_fontspector.py
      - name: Upload review packages and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tishte-googlefonts-readiness
          path: |
            build/googlefonts/ofl
            build/googlefonts/upstream
            artifacts/reports/googlefonts
            artifacts/reports/fontspector
